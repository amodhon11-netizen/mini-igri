<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Офисный день</title>
<script src="ach.js"></script>
<script>window.Ach=window.Ach||{add:function(){},max:function(){}};</script>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfd8d3;--desk:#e9eeea;--ink:#1f2a2e;--soft:#5b6a6e;--card:#fff;--line:#9fb0a9;--note:#ffe45e;--red:#d93a2b;--ok:#1f8a5b;--accent:#2b5d8a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a2224;--desk:#232e31;--ink:#e8efec;--soft:#97a8a8;--card:#2e3b3f;--line:#44575b;--note:#e6c93a;--red:#ff6252;--ok:#4cc790;--accent:#6fb0e8}}
:root[data-theme="dark"]{--bg:#1a2224;--desk:#232e31;--ink:#e8efec;--soft:#97a8a8;--card:#2e3b3f;--line:#44575b;--note:#e6c93a;--red:#ff6252;--ok:#4cc790;--accent:#6fb0e8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:820px;display:flex;flex-direction:column;padding:12px;gap:10px;min-height:100%}
.hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hud h1{font-size:20px;margin:0;font-weight:800;margin-right:auto}
.stat{font-weight:700;font-variant-numeric:tabular-nums}
.stress{flex:1 1 180px;min-width:150px}
.bar{height:14px;background:var(--desk);border:2px solid var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .1s,background .3s}
.stress small{color:var(--soft);font-size:12px}
#desk{position:relative;flex:1;min-height:440px;background:var(--desk);border:2px solid var(--line);border-radius:6px;overflow:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 36px;background-blend-mode:soft-light}
#task{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,88%);background:var(--card);border:2px solid var(--ink);border-radius:4px;padding:18px;box-shadow:6px 6px 0 var(--ink)}
#task.flash{animation:ok .35s}
@keyframes ok{0%{background:var(--ok)}100%{background:var(--card)}}
.kind{font-size:13px;color:var(--soft);margin-bottom:6px}
.prompt{font-size:26px;font-weight:800;margin-bottom:12px;line-height:1.2}
input{width:100%;font:inherit;font-size:20px;padding:10px;border:2px solid var(--ink);border-radius:3px;background:var(--desk);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--ink);background:var(--note);color:#1f2a2e;padding:10px 16px;border-radius:3px}
button:active{transform:translateY(1px)}
.pop{position:absolute;z-index:5;width:210px;background:var(--note);color:#1f2a2e;border:2px solid #1f2a2e;border-radius:3px;padding:10px 12px;font-size:14px;box-shadow:4px 4px 0 #1f2a2e;animation:pin .15s}
@keyframes pin{from{transform:scale(.7)}to{transform:scale(1)}}
.pop b{display:block;margin-bottom:4px}
.pop .x{position:absolute;right:4px;top:2px;border:0;background:none;padding:0 4px;font-size:15px;line-height:1.2;color:#1f2a2e;box-shadow:none}
.pop.boss{background:var(--red);color:#fff;border-color:#1f2a2e;animation:shake .25s infinite}
.pop.boss button{background:#fff}
.pop.call{background:#bfe3ff}
.pop.call{animation:shake .4s infinite}
.pop.ad{background:#fff;width:230px}
.pop.ad .big{width:100%;background:#2fbf71;color:#fff;margin-top:6px}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}75%{transform:translate(2px,-1px)}}
.pop button.act{margin-top:6px;padding:5px 10px}
.veil{position:absolute;inset:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}
.veil .box{background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:24px;max-width:420px}
.veil h2{margin:0 0 8px;font-size:28px}
.veil p{margin:0 0 14px;color:var(--soft);line-height:1.4}
.grid{display:flex;flex-wrap:wrap;gap:8px}.track{position:relative;height:22px;border:2px solid var(--ink);background:var(--desk);margin-bottom:12px}.zone{position:absolute;top:0;bottom:0;width:18%;background:var(--ok)}.cur{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--red)}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.pop,.pop.boss,.pop.call{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <a href="./" style="color:var(--accent);font-weight:700;text-decoration:none">← Все игры</a><h1>Офисный день</h1>
    <div class="stat">Время: <span id="time">60</span></div>
    <div class="stat">Сделано: <span id="done">0</span></div>
    <div class="stress"><small>Стресс</small><div class="bar"><i id="stressbar"></i></div></div>
  </div>
  <div id="desk">
    <div id="task"></div>
    <div id="layer"></div>
    <div class="veil" id="veil"><div class="box">
      <h2 id="vt">Понедельник, 9:00</h2>
      <p id="vp">Сделай как можно больше рабочих задач за 60 секунд. Мешать будут все: коллеги, босс, звонки и реклама. Если стресс дойдёт до предела, ты выгоришь. Закрывай помехи, но не забывай про дело.</p>
      <button id="go">Начать рабочий день</button>
    </div></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const phrases=['отчёт готов','согласовано','прошу подтвердить','по итогам встречи','сводная таблица','перенесём дедлайн','во вложении файл','направляю на подпись'];
const chats=['Валера: ты видел мем про начальника?','Лена: пойдём на кофе?','Дима: у тебя есть минутка?','Света: у кого-то есть зарядка?','Отдел кадров: заполни опрос счастья','Игорь: поздравляем Марину, скидываемся по 500','Бухгалтерия: где твой авансовый отчёт?','Валера: кто съел мой йогурт из холодильника?','Паша: глянь мою презентацию, я быстро','Коллега: ты идёшь на корпоратив? Ответь срочно','IT-отдел: перезагрузи компьютер, пожалуйста','Охрана: чья машина мешает выезду?'];
const ads=['Вы выиграли отпуск на Мальдивах!','Одна простая уловка от разработчиков','Ваш компьютер заражён! Нажмите сюда','Горячие вакансии у вас в районе!','Скидка 90% на офисные кресла!'];
let S,timer,sp,tk;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];

function refocus(){const i=$('inp');if(i)i.focus()}
function finishTask(){
  S.done++;$('done').textContent=S.done;Ach.add('office_total',1);Ach.max('office_day',S.done);
  const t=$('task');t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');
  newTask();
}
function newTask(){
  clearInterval(tk);
  const t=$('task');const k=pick(['type','math','stamp','file','order','code','sign']);
  if(k==='type'){
    const p=pick(phrases);
    t.innerHTML='<div class="kind">Напечатай письмо клиенту</div><div class="prompt"></div><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false">';
    t.querySelector('.prompt').textContent=p;
    $('inp').addEventListener('input',e=>{if(e.target.value.trim().toLowerCase()===p)finishTask()});
  }else if(k==='math'){
    const a=Math.floor(rnd(11,60)),b=Math.floor(rnd(11,60));
    t.innerHTML='<div class="kind">Сверь смету</div><div class="prompt">'+a+' + '+b+' = ?</div><input id="inp" inputmode="numeric" autocomplete="off">';
    $('inp').addEventListener('input',e=>{if(e.target.value.trim()==String(a+b))finishTask()});
  }else if(k==='stamp'){
    let n=Math.floor(rnd(5,9));
    t.innerHTML='<div class="kind">Поставь печати на договоры</div><div class="prompt">Осталось: <span id="n">'+n+'</span></div><button id="stamp">Печать</button>';
    $('stamp').addEventListener('click',()=>{n--;$('n').textContent=n;if(n<=0)finishTask()});
  }else if(k==='file'){
    const names=['Отчёт_финал','Отчёт_финал_v2','Отчёт_финал_правки','Отчёт_финал_НОВЫЙ','Отчёт_финал_точно'];
    const right=pick(names);
    t.innerHTML='<div class="kind">Найди нужный файл и отправь</div><div class="prompt"></div><div class="grid"></div>';
    t.querySelector('.prompt').textContent=right;
    const g=t.querySelector('.grid');
    names.slice().sort(()=>Math.random()-.5).forEach(nm=>{const b=document.createElement('button');b.textContent=nm;b.onclick=()=>{if(nm===right)finishTask();else S.stress=Math.min(100,S.stress+6)};g.appendChild(b)});
  }else if(k==='order'){
    let nx=1;
    t.innerHTML='<div class="kind">Пронумеруй страницы по порядку</div><div class="prompt">от 1 до 6</div><div class="grid"></div>';
    const g=t.querySelector('.grid');
    [1,2,3,4,5,6].sort(()=>Math.random()-.5).forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===nx){b.disabled=true;nx++;if(nx>6)finishTask()}else S.stress=Math.min(100,S.stress+4)};g.appendChild(b)});
  }else if(k==='code'){
    const c=String(Math.floor(rnd(100000,999999)));
    t.innerHTML='<div class="kind">Перепиши номер счёта</div><div class="prompt">'+c+'</div><input id="inp" inputmode="numeric" autocomplete="off">';
    $('inp').addEventListener('input',e=>{if(e.target.value.trim()===c)finishTask()});
  }else{
    t.innerHTML='<div class="kind">Подпиши договор: жми, когда красная полоска в зелёной зоне</div><div class="track"><i class="zone"></i><i class="cur"></i></div><button id="sg">Подписать</button>';
    const zl=rnd(10,72),zone=t.querySelector('.zone'),cur=t.querySelector('.cur');
    zone.style.left=zl+'%';
    let x=0,d=1.8;
    tk=setInterval(()=>{x+=d;if(x>=100||x<=0)d=-d;cur.style.left=x+'%'},20);
    $('sg').onclick=()=>{if(x>=zl&&x<=zl+18)finishTask();else S.stress=Math.min(100,S.stress+5)};
  }
  refocus();
}
function closePop(p){if(!p.isConnected)return;p.remove();S.pops.delete(p);refocus()}
function spawn(){
  if(S.pops.size>=6)return;
  const d=$('desk'),W=d.clientWidth,H=d.clientHeight;
  const p=document.createElement('div');p.className='pop';p.weight=1;
  const r=Math.random();
  let type=pick(['chat','chat','ad','ad','call','boss','printer','meeting','birthday','email']);
  const w=type==='ad'?230:210;
  p.style.left=rnd(4,Math.max(5,W-w-8))+'px';p.style.top=rnd(4,Math.max(5,H-120))+'px';
  if(type==='chat'){
    p.innerHTML='<button class="x" aria-label="Закрыть">×</button><b>Чат</b><span></span>';
    p.querySelector('span').textContent=pick(chats);
    p.querySelector('.x').onclick=()=>closePop(p);
  }else if(type==='call'){
    p.className='pop call';p.weight=1.5;
    p.innerHTML='<b>Звонок: мама</b>Телефон звонит!<br><button class="act">Ответить</button>';
    p.querySelector('.act').onclick=()=>closePop(p);
  }else if(type==='boss'){
    p.className='pop boss';p.weight=2.5;
    p.innerHTML='<b>БОСС</b>СРОЧНО зайди ко мне!<br><button class="act">Бегу</button>';
    p.querySelector('.act').onclick=()=>closePop(p);
  }else if(type==='printer'||type==='meeting'){
    const pr=type==='printer';let n=pr?3:4;
    p.weight=pr?1.5:2;
    p.innerHTML='<b></b><span></span><br><button class="act"></button>';
    p.querySelector('b').textContent=pr?'Принтер':'Календарь';
    const tx=p.querySelector('span'),bt=p.querySelector('.act');
    bt.textContent=pr?'Дёрнуть лоток':'Кивать';
    const upd=()=>{tx.textContent=pr?'Замялась бумага! Дёрнуть ещё: '+n:'Созвон «на 5 минут». Слушать ещё: '+n};
    upd();
    bt.onclick=()=>{n--;if(n<=0)closePop(p);else upd()};
  }else if(type==='birthday'){
    p.weight=.4;
    p.innerHTML='<b>Тортик!</b>У Марины день рождения, торт в переговорке<br><button class="act">Съесть кусочек</button>';
    p.querySelector('.act').onclick=()=>{S.stress=Math.max(0,S.stress-10);closePop(p)};
  }else if(type==='email'){
    p.weight=1.2;
    p.innerHTML='<b>Вся компания</b>Re: Re: Re: Всем привет!<br><button class="act">Удалить</button> <button class="act">Ответить всем</button>';
    const bs=p.querySelectorAll('.act');
    bs[0].onclick=()=>closePop(p);
    bs[1].onclick=()=>{closePop(p);spawn();spawn()};
  }else{
    p.className='pop ad';
    p.innerHTML='<button class="x" aria-label="Закрыть">×</button><b></b><button class="big">Забрать приз</button>';
    p.querySelector('b').textContent=pick(ads);
    const x=p.querySelector('.x');
    x.onclick=()=>closePop(p);
    x.addEventListener('mouseenter',()=>{if(Math.random()<.6){x.style.right=rnd(4,160)+'px';x.style.top=rnd(2,50)+'px'}});
    p.querySelector('.big').onclick=()=>{S.stress=Math.min(100,S.stress+12);closePop(p);spawn()};
  }
  $('layer').appendChild(p);S.pops.add(p);
}
function tick(){
  S.left-=.1;S.el+=.1;
  let load=0;S.pops.forEach(p=>load+=p.weight);
  S.stress+=load?load*0.9*.1+.0:-.5;
  S.stress=Math.max(0,Math.min(100,S.stress));
  sp-=.1;
  if(sp<=0){spawn();sp=Math.max(1.3,rnd(2.5,4.5)-S.el/25)}
  const b=$('stressbar');b.style.width=S.stress+'%';
  b.style.background=S.stress>70?'var(--red)':S.stress>40?'var(--note)':'var(--ok)';
  $('time').textContent=Math.max(0,Math.ceil(S.left));
  if(S.stress>=100)end('burnout');else if(S.left<=0)end('time');
}
function end(why){
  clearInterval(timer);clearInterval(tk);
  const n=S.done;if(why==='time'){Ach.add('office_surv',1);if(S.stress<30&&n>=5)Ach.add('office_calm',1)}
  const rank=n<4?'Стажёр':n<8?'Менеджер среднего звена':n<12?'Старший специалист':'Директор по всему';
  $('vt').textContent=why==='burnout'?'Ты выгорел':'Рабочий день окончен';
  $('vp').textContent='Задач сделано: '+n+'. Твоя должность: '+rank+'.';
  $('go').textContent='Ещё один день';
  $('veil').classList.remove('hide');
}
function start(){
  $('layer').innerHTML='';
  S={left:60,el:0,done:0,stress:0,pops:new Set()};sp=2;
  $('done').textContent=0;$('veil').classList.add('hide');
  newTask();clearInterval(timer);timer=setInterval(tick,100);
}
$('go').addEventListener('click',start);
</script>
</body>
</html>
