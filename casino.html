<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Казино «Рискни»</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfd8d3;--ink:#1f2a2e;--soft:#5b6a6e;--card:#fff;--accent:#2b5d8a;--note:#ffe45e;--ok:#1f8a5b;--red:#d93a2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a2224;--ink:#e8efec;--soft:#97a8a8;--card:#2e3b3f;--accent:#6fb0e8;--ok:#4cc790;--red:#ff6252}}
:root[data-theme="dark"]{--bg:#1a2224;--ink:#e8efec;--soft:#97a8a8;--card:#2e3b3f;--accent:#6fb0e8;--ok:#4cc790;--red:#ff6252}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:12px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;margin:0;font-weight:800}
.top a{color:var(--accent);font-weight:700;text-decoration:none}
.bank{display:flex;justify-content:space-between;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.goal{height:12px;border:2px solid var(--ink);background:var(--card)}
.goal i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.machine{background:var(--card);border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px}
.reels{display:flex;gap:10px;justify-content:center}
.reel{width:30%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,14vw,68px);border:2px solid var(--ink);background:var(--bg)}
#msg{min-height:44px;font-weight:800;text-align:center;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:700;padding:10px 14px;border:2px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);cursor:pointer}
button.on{background:var(--note);color:#1f2a2e}
button:disabled{opacity:.4;cursor:not-allowed}
#spin{background:var(--red);color:#fff;font-size:20px;padding:14px}
#gam{background:var(--note);color:#1f2a2e}
.shop{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.shop button{text-align:left;font-weight:400;font-size:13px}
.shop b{display:block;font-size:15px}
.hide{display:none}
.note{color:var(--soft);font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div class="top"><a href="./">← Все игры</a><h1>Казино «Рискни»</h1></div>
  <div class="bank"><span>Монеты: <span id="coins">100</span></span><span>Цель: 1000</span></div>
  <div class="goal"><i id="gl"></i></div>
  <div class="machine">
    <div class="reels"><div class="reel">🍒</div><div class="reel">🍋</div><div class="reel">🔔</div></div>
    <div id="msg">Сделай ставку и крути!</div>
    <div class="row" id="bets"></div>
    <div class="row"><button id="spin">Крутить</button><button id="gam" class="hide">Рискнуть: 50 на 50</button></div>
  </div>
  <div>
    <b>Талисманы</b>
    <div class="shop" id="shop"></div>
  </div>
  <div class="row"><button id="rst">Начать заново</button></div>
  <div class="note">Игровые монеты, настоящих денег нет. Три одинаковых символа дают большой приз, пара даёт небольшой бонус, а три черепа забирают двойную ставку. Дойди до 1000 монет и сорви банк.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const SY=['🍒','🍋','🔔','⭐','7️⃣','💀'];
const PAY={'🍒':6,'🍋':9,'🔔':15,'⭐':30,'7️⃣':100};
let coins,bet,cur,luck,mult,ins,busy,win,ended;
function reset(){coins=100;bet=10;luck=0;mult=false;ins=false;busy=false;win=0;ended=false;
 document.querySelectorAll('.reel').forEach((e,i)=>e.textContent=['🍒','🍋','🔔'][i]);
 $('gam').classList.add('hide');msg('Сделай ставку и крути!');render()}
function msg(t){$('msg').textContent=t}
function roll(){const w=[30+4*luck,25,18,10,4,Math.max(1,13-4*luck)];let r=Math.random()*w.reduce((a,b)=>a+b),i=0;
 while(r>=w[i]){r-=w[i];i++}return SY[i]}
function render(){
 $('coins').textContent=coins;$('gl').style.width=Math.min(100,coins/10)+'%';
 if(!busy)bet=Math.max(Math.min(bet,coins),Math.min(10,coins));
 const bs=$('bets');bs.innerHTML='';
 [10,25,50,'Всё'].forEach(v=>{const b=document.createElement('button'),a=v==='Всё'?coins:v;
  b.textContent=v==='Всё'?'Всё ('+coins+')':v;b.disabled=busy||ended||a>coins||a<1;if(bet===a)b.className='on';
  b.onclick=()=>{bet=a;render()};bs.appendChild(b)});
 $('spin').disabled=busy||ended||bet>coins||bet<1;$('gam').disabled=busy||ended;
 const sh=$('shop');sh.innerHTML='';
 const items=[
  ['Клевер удачи','Меньше черепов, больше вишен ('+luck+'/2)',60+40*luck,luck>=2,()=>{luck++}],
  ['Золотой множитель','Все выигрыши ×1.5',120,mult,()=>{mult=true}],
  ['Страховка','При проигрыше вернёт 40% ставки',80,ins,()=>{ins=true}]];
 items.forEach(([n,d,c,own,fn])=>{const b=document.createElement('button');
  b.innerHTML='<b></b>'+d+'<br>'+(own?'Куплено':'Цена: '+c);b.querySelector('b').textContent=n;
  b.disabled=own||busy||ended||coins<c;b.onclick=()=>{coins-=c;fn();msg('Куплено: '+n);render()};sh.appendChild(b)})}
function finish(){
 if(coins>=1000){ended=true;msg('Ты сорвал банк! 🎉 Победа!')}
 else if(coins<10){ended=true;msg('Банкрот. Нажми «Начать заново».')}
 render()}
function spin(){if(busy||ended||bet>coins)return;busy=true;cur=bet;coins-=cur;win=0;
 $('gam').classList.add('hide');msg('Крутим…');render();
 const res=[roll(),roll(),roll()];
 document.querySelectorAll('.reel').forEach((e,i)=>{
  const iv=setInterval(()=>{e.textContent=SY[Math.floor(Math.random()*6)]},70);
  setTimeout(()=>{clearInterval(iv);e.textContent=res[i];if(i===2)settle(res)},600+i*450)})}
function settle(r){const m=mult?1.5:1;const bet=cur;busy=false;
 if(r[0]===r[1]&&r[1]===r[2]){
  if(r[0]==='💀'){coins=Math.max(0,coins-bet);msg('Три черепа! Двойной штраф.')}
  else{win=Math.round(bet*PAY[r[0]]*m);msg('ДЖЕКПОТ! +'+win)}}
 else if((r[0]===r[1]||r[1]===r[2]||r[0]===r[2])&&r.filter(x=>x==='💀').length<2){
  win=Math.round(bet*1.3*m);msg('Пара! +'+win)}
 else{msg('Мимо. -'+bet);if(ins){const b=Math.round(bet*.4);coins+=b;msg('Мимо. -'+bet+', страховка вернула '+b)}}
 coins+=win;
 if(win>0){$('gam').textContent='Рискнуть: удвоить '+win+' или потерять';$('gam').classList.remove('hide')}
 finish()}
function gamble(){if(busy||ended||win<=0)return;
 if(Math.random()<.5){coins+=win;win*=2;msg('Удвоил! Выигрыш: '+win);$('gam').textContent='Рискнуть ещё: удвоить '+win+' или потерять'}
 else{coins-=win;msg('Не повезло, выигрыш сгорел.');win=0;$('gam').classList.add('hide')}
 finish()}
$('spin').onclick=spin;$('gam').onclick=gamble;$('rst').onclick=reset;reset();
</script>
</body>
</html>
