<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сапёр</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#cfd8d3;--ink:#1f2a2e;--soft:#5b6a6e;--card:#fff;--accent:#2b5d8a;--note:#ffe45e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1a2224;--ink:#e8efec;--soft:#97a8a8;--card:#2e3b3f;--accent:#6fb0e8}}
:root[data-theme="dark"]{--bg:#1a2224;--ink:#e8efec;--soft:#97a8a8;--card:#2e3b3f;--accent:#6fb0e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:600px;padding:12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.top{width:100%;display:flex;align-items:center;gap:12px}
.top h1{font-size:20px;margin:0;font-weight:800}
.top a{color:var(--accent);font-weight:700;text-decoration:none}
.ctl{width:100%;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,button{font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink)}
button{background:var(--note);color:#1f2a2e;cursor:pointer}
.hud{width:100%;display:flex;gap:16px;font-weight:800;font-variant-numeric:tabular-nums}
#st{margin-left:auto}
#bd{--bs:min(92vw,560px);width:var(--bs);height:var(--bs);display:grid;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);gap:1px;background:#6c8a7c;touch-action:manipulation}
.c{min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--bs)/var(--n)*.6);background:#a9bdb3;cursor:pointer;user-select:none;-webkit-user-select:none;color:#1f2a2e}
.c.o{background:#e8eeea;cursor:default}
.c.mine{background:#f0b3ab}.c.boom{background:#d93a2b}
.n1{color:#1f5fbf}.n2{color:#1f8a3b}.n3{color:#d02b2b}.n4{color:#6a2bb0}.n5{color:#8a2b1f}.n6{color:#1a8a8a}.n7{color:#111}.n8{color:#666}
.note{color:var(--soft);font-size:13px;width:100%}
</style>
</head>
<body>
<div id="app">
  <div class="top"><a href="./">← Все игры</a><h1>Сапёр</h1></div>
  <div class="ctl">
    <select id="lvl" aria-label="Сложность"><option value="easy">Новичок 9×9</option><option value="mid">Любитель 12×12</option><option value="hard">Эксперт 16×16</option></select>
    <button id="mode">Режим: открывать</button>
    <button id="new">Заново</button>
  </div>
  <div class="hud"><span>Мины: <span id="mc">0</span></span><span>Время: <span id="tm">0</span></span><span id="st"></span></div>
  <div id="bd"></div>
  <div class="note">На компьютере: правая кнопка мыши ставит флажок. На телефоне: переключи режим на «флажок». Клик по цифре с нужным числом флажков открывает соседей. Первый клик всегда безопасный.</div>
</div>
<script>
const $=id=>document.getElementById(id);
const LV={easy:[9,9,10],mid:[12,12,25],hard:[16,16,40]};
let W,H,M,mines,opn,flg,els,over,started,tm,t0,mode='open',nopen;
function nb(i){const x=i%W,y=(i/W)|0,o=[];for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const a=x+dx,b=y+dy;if(a>=0&&a<W&&b>=0&&b<H)o.push(b*W+a)}return o}
const cnt=i=>nb(i).filter(j=>mines[j]).length;
function info(t){let f=0;flg.forEach(v=>f+=v);$('mc').textContent=M-f;if(t!==undefined)$('st').textContent=t}
function init(){[W,H,M]=LV[$('lvl').value];
 mines=new Uint8Array(W*H);opn=new Uint8Array(W*H);flg=new Uint8Array(W*H);
 over=false;started=false;nopen=0;clearInterval(tm);$('tm').textContent='0';
 const bd=$('bd');bd.innerHTML='';bd.style.gridTemplateColumns='repeat('+W+',1fr)';bd.style.gridTemplateRows='repeat('+H+',1fr)';bd.style.setProperty('--n',W);
 els=[];for(let i=0;i<W*H;i++){const d=document.createElement('div');d.className='c';d.onclick=()=>tap(i);d.oncontextmenu=e=>{e.preventDefault();toggle(i)};bd.appendChild(d);els.push(d)}
 info('Удачи!')}
function place(first){const safe=new Set([first,...nb(first)]);let n=0;
 while(n<M){const r=Math.floor(Math.random()*W*H);if(safe.has(r)||mines[r])continue;mines[r]=1;n++}}
function paint(i){const d=els[i];
 if(opn[i]){const n=cnt(i);d.className='c o'+(n?' n'+n:'');d.textContent=n||''}
 else{d.className='c';d.textContent=flg[i]?'🚩':''}}
function reveal(i){const st=[i];
 while(st.length){const j=st.pop();if(opn[j]||flg[j])continue;opn[j]=1;nopen++;paint(j);
  if(!cnt(j))nb(j).forEach(k=>{if(!opn[k])st.push(k)})}}
function toggle(i){if(over||opn[i])return;flg[i]^=1;paint(i);info()}
function lose(i){over=true;clearInterval(tm);
 mines.forEach((m,j)=>{if(m){els[j].className='c o mine';els[j].textContent='💣'}});
 els[i].className='c o boom';els[i].textContent='💣';info('Бабах! Попробуй ещё');}
function checkWin(){if(nopen===W*H-M){over=true;clearInterval(tm);
 mines.forEach((m,j)=>{if(m){flg[j]=1;paint(j)}});info('Победа! '+Math.floor((Date.now()-t0)/1000)+' с 🎉')}}
function chord(i){const n=cnt(i);if(!n)return;
 if(nb(i).filter(j=>flg[j]).length!==n)return;
 for(const j of nb(i)){if(!flg[j]&&!opn[j]){if(mines[j]){lose(j);return}reveal(j)}}
 checkWin()}
function tap(i){if(over)return;
 if(opn[i]){chord(i);return}
 if(mode==='flag'){toggle(i);return}
 if(flg[i])return;
 if(!started){started=true;place(i);t0=Date.now();tm=setInterval(()=>{$('tm').textContent=Math.floor((Date.now()-t0)/1000)},500)}
 if(mines[i]){lose(i);return}
 reveal(i);checkWin()}
$('mode').onclick=()=>{mode=mode==='open'?'flag':'open';$('mode').textContent='Режим: '+(mode==='open'?'открывать':'флажок')};
$('new').onclick=init;$('lvl').onchange=init;init();
</script>
</body>
</html>
